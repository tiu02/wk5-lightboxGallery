<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lightbox Gallery</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Image Gallery</h1>
    </header>

    <main>
      <ul class="gallery">
        <li>
          <figure class="gallery__item">
            <button type="button" data-index="0" aria-label="View full image: Pine forest overlooking a mountain lake">
              <img src="https://picsum.photos/id/10/400/300" alt="" />
            </button>
            <figcaption class="gallery__caption" aria-hidden="true">Pine Forest Lake</figcaption>
          </figure>
        </li>
        <li>
          <figure class="gallery__item">
            <button type="button" data-index="1" aria-label="View full image: Designer's desk flat lay with laptop and sketchbook">
              <img src="https://picsum.photos/id/20/400/300" alt="" />
            </button>
            <figcaption class="gallery__caption" aria-hidden="true">Designer's Desk</figcaption>
          </figure>
        </li>
        <li>
          <figure class="gallery__item">
            <button type="button" data-index="2" aria-label="View full image: Close-up of a vintage Cuban postage stamp mug">
              <img src="https://picsum.photos/id/30/400/300" alt="" />
            </button>
            <figcaption class="gallery__caption" aria-hidden="true">Cuban Stamp Mug</figcaption>
          </figure>
        </li>
        <li>
          <figure class="gallery__item">
            <button type="button" data-index="3" aria-label="View full image: Macro shot of a cat's nose and whiskers">
              <img src="https://picsum.photos/id/40/400/300" alt="" loading="lazy" />
            </button>
            <figcaption class="gallery__caption" aria-hidden="true">Cat Nose Macro</figcaption>
          </figure>
        </li>
        <li>
          <figure class="gallery__item">
            <button type="button" data-index="4" aria-label="View full image: Cormorant spreading wings on a sailboat mooring">
              <img src="https://picsum.photos/id/50/400/300" alt="" loading="lazy" />
            </button>
            <figcaption class="gallery__caption" aria-hidden="true">Cormorant at Mooring</figcaption>
          </figure>
        </li>
        <li>
          <figure class="gallery__item">
            <button type="button" data-index="5" aria-label="View full image: Top-down flat lay of tech devices and accessories">
              <img src="https://picsum.photos/id/60/400/300" alt="" loading="lazy" />
            </button>
            <figcaption class="gallery__caption" aria-hidden="true">Tech Devices Flat Lay</figcaption>
          </figure>
        </li>
        <li>
          <figure class="gallery__item">
            <button type="button" data-index="6" aria-label="View full image: Misty tree-lined road disappearing into fog">
              <img src="https://picsum.photos/id/70/400/300" alt="" loading="lazy" />
            </button>
            <figcaption class="gallery__caption" aria-hidden="true">Misty Tree Road</figcaption>
          </figure>
        </li>
        <li>
          <figure class="gallery__item">
            <button type="button" data-index="7" aria-label="View full image: Pine cones in black and white macro">
              <img src="https://picsum.photos/id/80/400/300" alt="" loading="lazy" />
            </button>
            <figcaption class="gallery__caption" aria-hidden="true">Pine Cones B&amp;W</figcaption>
          </figure>
        </li>
        <li>
          <figure class="gallery__item">
            <button type="button" data-index="8" aria-label="View full image: Colourful glass bottles on a wooden fence">
              <img src="https://picsum.photos/id/90/400/300" alt="" loading="lazy" />
            </button>
            <figcaption class="gallery__caption" aria-hidden="true">Glass Bottles Fence</figcaption>
          </figure>
        </li>
      </ul>
    </main>

    <!-- Lightbox overlay — opened/closed by JS (Steps 4–5) -->
    <div id="lightbox" class="lightbox"
         role="dialog" aria-modal="true" aria-labelledby="lightbox-title">
      <button type="button" class="lightbox__close" aria-label="Close lightbox">&times;</button>
      <button type="button" class="lightbox__prev" aria-label="Previous image">&#8249;</button>
      <figure class="lightbox__figure">
        <img class="lightbox__img" alt="" />
        <figcaption class="lightbox__caption">
          <p class="lightbox__title" id="lightbox-title"></p>
          <p class="lightbox__desc"></p>
        </figcaption>
      </figure>
      <button type="button" class="lightbox__next" aria-label="Next image">&#8250;</button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
