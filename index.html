<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lightbox Gallery</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Image Gallery</h1>
    </header>

    <main>
      <ul class="gallery">
        <li>
          <button type="button" data-index="0" aria-label="View full image: Forest path with sunlight filtering through tall trees">
            <img src="https://picsum.photos/id/10/400/300" alt="Forest path with sunlight filtering through tall trees" />
          </button>
        </li>
        <li>
          <button type="button" data-index="1" aria-label="View full image: Rocky mountain landscape under a clear blue sky">
            <img src="https://picsum.photos/id/20/400/300" alt="Rocky mountain landscape under a clear blue sky" />
          </button>
        </li>
        <li>
          <button type="button" data-index="2" aria-label="View full image: Calm lake reflecting surrounding pine trees">
            <img src="https://picsum.photos/id/30/400/300" alt="Calm lake reflecting surrounding pine trees" />
          </button>
        </li>
        <li>
          <button type="button" data-index="3" aria-label="View full image: Aerial view of a winding river through green fields">
            <img src="https://picsum.photos/id/40/400/300" alt="Aerial view of a winding river through green fields" loading="lazy" />
          </button>
        </li>
        <li>
          <button type="button" data-index="4" aria-label="View full image: Close-up of a wooden dock extending over still water">
            <img src="https://picsum.photos/id/50/400/300" alt="Close-up of a wooden dock extending over still water" loading="lazy" />
          </button>
        </li>
        <li>
          <button type="button" data-index="5" aria-label="View full image: Snow-capped peaks rising above low clouds">
            <img src="https://picsum.photos/id/60/400/300" alt="Snow-capped peaks rising above low clouds" loading="lazy" />
          </button>
        </li>
        <li>
          <button type="button" data-index="6" aria-label="View full image: Golden wheat field at sunset">
            <img src="https://picsum.photos/id/70/400/300" alt="Golden wheat field at sunset" loading="lazy" />
          </button>
        </li>
        <li>
          <button type="button" data-index="7" aria-label="View full image: Cobblestone street lined with colourful buildings">
            <img src="https://picsum.photos/id/80/400/300" alt="Cobblestone street lined with colourful buildings" loading="lazy" />
          </button>
        </li>
        <li>
          <button type="button" data-index="8" aria-label="View full image: Desert sand dunes casting long evening shadows">
            <img src="https://picsum.photos/id/90/400/300" alt="Desert sand dunes casting long evening shadows" loading="lazy" />
          </button>
        </li>
      </ul>
    </main>

    <!-- Lightbox overlay — opened/closed by JS in Step 4 -->
    <div id="lightbox" class="lightbox">
      <button type="button" class="lightbox__close" aria-label="Close lightbox">&times;</button>
      <img class="lightbox__img" src="" alt="" />
    </div>

    <script src="script.js"></script>
  </body>
</html>
