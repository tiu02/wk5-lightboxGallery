<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lightbox Gallery</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Image Gallery</h1>
    </header>

    <main>
      <ul class="gallery">
        <li>
          <figure class="gallery__item">
            <button type="button" data-index="0" aria-label="View full image: Pine forest overlooking a mountain lake">
              <img src="https://picsum.photos/id/10/400/300" alt="Pine forest overlooking a mountain lake" />
            </button>
            <figcaption class="gallery__caption" aria-hidden="true">Pine forest overlooking a mountain lake</figcaption>
          </figure>
        </li>
        <li>
          <figure class="gallery__item">
            <button type="button" data-index="1" aria-label="View full image: Designer's desk flat lay with laptop and sketchbook">
              <img src="https://picsum.photos/id/20/400/300" alt="Designer's desk flat lay with laptop and sketchbook" />
            </button>
            <figcaption class="gallery__caption" aria-hidden="true">Designer's desk flat lay with laptop and sketchbook</figcaption>
          </figure>
        </li>
        <li>
          <figure class="gallery__item">
            <button type="button" data-index="2" aria-label="View full image: Close-up of a vintage Cuban postage stamp mug">
              <img src="https://picsum.photos/id/30/400/300" alt="Close-up of a vintage Cuban postage stamp mug" />
            </button>
            <figcaption class="gallery__caption" aria-hidden="true">Close-up of a vintage Cuban postage stamp mug</figcaption>
          </figure>
        </li>
        <li>
          <figure class="gallery__item">
            <button type="button" data-index="3" aria-label="View full image: Macro shot of a cat's nose and whiskers">
              <img src="https://picsum.photos/id/40/400/300" alt="Macro shot of a cat's nose and whiskers" loading="lazy" />
            </button>
            <figcaption class="gallery__caption" aria-hidden="true">Macro shot of a cat's nose and whiskers</figcaption>
          </figure>
        </li>
        <li>
          <figure class="gallery__item">
            <button type="button" data-index="4" aria-label="View full image: Cormorant spreading wings on a sailboat mooring">
              <img src="https://picsum.photos/id/50/400/300" alt="Cormorant spreading wings on a sailboat mooring" loading="lazy" />
            </button>
            <figcaption class="gallery__caption" aria-hidden="true">Cormorant spreading wings on a sailboat mooring</figcaption>
          </figure>
        </li>
        <li>
          <figure class="gallery__item">
            <button type="button" data-index="5" aria-label="View full image: Top-down flat lay of tech devices and accessories">
              <img src="https://picsum.photos/id/60/400/300" alt="Top-down flat lay of tech devices and accessories" loading="lazy" />
            </button>
            <figcaption class="gallery__caption" aria-hidden="true">Top-down flat lay of tech devices and accessories</figcaption>
          </figure>
        </li>
        <li>
          <figure class="gallery__item">
            <button type="button" data-index="6" aria-label="View full image: Misty tree-lined road disappearing into fog">
              <img src="https://picsum.photos/id/70/400/300" alt="Misty tree-lined road disappearing into fog" loading="lazy" />
            </button>
            <figcaption class="gallery__caption" aria-hidden="true">Misty tree-lined road disappearing into fog</figcaption>
          </figure>
        </li>
        <li>
          <figure class="gallery__item">
            <button type="button" data-index="7" aria-label="View full image: Pine cones in black and white macro">
              <img src="https://picsum.photos/id/80/400/300" alt="Pine cones in black and white macro" loading="lazy" />
            </button>
            <figcaption class="gallery__caption" aria-hidden="true">Pine cones in black and white macro</figcaption>
          </figure>
        </li>
        <li>
          <figure class="gallery__item">
            <button type="button" data-index="8" aria-label="View full image: Colourful glass bottles on a wooden fence">
              <img src="https://picsum.photos/id/90/400/300" alt="Colourful glass bottles on a wooden fence" loading="lazy" />
            </button>
            <figcaption class="gallery__caption" aria-hidden="true">Colourful glass bottles on a wooden fence</figcaption>
          </figure>
        </li>
      </ul>
    </main>

    <!-- Lightbox overlay — opened/closed by JS in Step 4 -->
    <div id="lightbox" class="lightbox">
      <button type="button" class="lightbox__close" aria-label="Close lightbox">&times;</button>
      <figure class="lightbox__figure">
        <img class="lightbox__img" alt="" />
        <figcaption class="lightbox__caption"></figcaption>
      </figure>
    </div>

    <script src="script.js"></script>
  </body>
</html>
