<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lightbox Gallery</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Image Gallery</h1>
    </header>

    <main>
      <ul class="gallery" role="list">
        <li>
          <button type="button" aria-label="Open image 1 in lightbox">
            <img src="https://picsum.photos/id/10/400/300" alt="Forest path with sunlight filtering through tall trees" loading="lazy" />
          </button>
        </li>
        <li>
          <button type="button" aria-label="Open image 2 in lightbox">
            <img src="https://picsum.photos/id/20/400/300" alt="Rocky mountain landscape under a clear blue sky" loading="lazy" />
          </button>
        </li>
        <li>
          <button type="button" aria-label="Open image 3 in lightbox">
            <img src="https://picsum.photos/id/30/400/300" alt="Calm lake reflecting surrounding pine trees" loading="lazy" />
          </button>
        </li>
        <li>
          <button type="button" aria-label="Open image 4 in lightbox">
            <img src="https://picsum.photos/id/40/400/300" alt="Aerial view of a winding river through green fields" loading="lazy" />
          </button>
        </li>
        <li>
          <button type="button" aria-label="Open image 5 in lightbox">
            <img src="https://picsum.photos/id/50/400/300" alt="Close-up of a wooden dock extending over still water" loading="lazy" />
          </button>
        </li>
        <li>
          <button type="button" aria-label="Open image 6 in lightbox">
            <img src="https://picsum.photos/id/60/400/300" alt="Snow-capped peaks rising above low clouds" loading="lazy" />
          </button>
        </li>
        <li>
          <button type="button" aria-label="Open image 7 in lightbox">
            <img src="https://picsum.photos/id/70/400/300" alt="Golden wheat field at sunset" loading="lazy" />
          </button>
        </li>
        <li>
          <button type="button" aria-label="Open image 8 in lightbox">
            <img src="https://picsum.photos/id/80/400/300" alt="Cobblestone street lined with colourful buildings" loading="lazy" />
          </button>
        </li>
        <li>
          <button type="button" aria-label="Open image 9 in lightbox">
            <img src="https://picsum.photos/id/90/400/300" alt="Desert sand dunes casting long evening shadows" loading="lazy" />
          </button>
        </li>
      </ul>
    </main>

    <script src="script.js"></script>
  </body>
</html>
